name: Nightly build Linux x64

on:
  push:
    tags:
      - 'Nightly_a'

jobs:
  set-revision:
    name: set revision
    runs-on: ubuntu-24.04
    outputs:
      output1: ${{ steps.out1.outputs.revision }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: detect revision
      run: |
        read text < ./src/simutrans/revision.h
        revision=${text:17:5}
        echo "revision=$revision" >> $GITHUB_ENV
    - id: out1
      run: echo "revision=$revision" >> $GITHUB_OUTPUT

  simulinux-x64-nightly:
    name: simutrans SDL3
    runs-on: ubuntu-26.04
    needs: [set-revision]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: install_dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -ym install libsdl3-dev
          sudo apt-get -ym install libfreetype6-dev
          sudo apt-get -ym install libfontconfig-dev
          sudo apt-get -ym install libbz2-dev
          sudo apt-get -ym install libminiupnpc-dev
          sudo apt-get -ym install libzstd-dev

          # We build fluidsynth with the minimum set of options we need to keep dependencies low
          sudo apt-get -ym install libsndfile1-dev
          wget https://github.com/FluidSynth/fluidsynth/archive/refs/tags/v2.3.0.tar.gz
          tar xf v*.tar.gz
          cd fluidsynth*
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -Denable-aufile=0 -Denable-dbus=0 -Denable-ipv6=0 -Denable-jack=0 -Denable-ladspa=0 -Denable-midishare=0 -Denable-opensles=0 -Denable-oboe=0 -Denable-oss=0 -Denable-readline=0 -Denable-winmidi=0 -Denable-waveout=0 -Denable-network=0 -Denable-pulseaudio=0 -Denable-dsound=0 -Denable-alsa=0 -Denable-libinstpatch=0 -Denable-portaudio=0 -Denable-wasapi=0 -Denable-openmp=1 -Denable-libsndfile=1 -Denable-sdl3=1
          cmake --build build -j $(nproc)
          sudo cmake --install build

      - name: setup
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPTION_BUNDLE_LIBRARIES=ON
          cp ./revision.h ./build/revision.h
          cmake --build build -j$(nproc) --target install

      - name: distribute
        run: |
          chmod -v 755 ./tools/lang_files_standard.sh
          ./tools/lang_files_standard.sh
          cp simutrans/text/* build/simutrans/text
          cd build
          zip -r simulinux-x64-sdl3-nightly.zip simutrans

      - name: Update binaries of Nightly Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/simulinux-x64-sdl3-nightly.zip
          asset_name: simulinux-x64-sdl3-nightly_r${{ needs.set-revision.outputs.output1 }}.zip
          tag: Nightly
          overwrite: true
